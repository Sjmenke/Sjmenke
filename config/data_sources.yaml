# Data Sources Configuration for TQQQ Market Regime Detection Framework

# Primary Tickers to Track
tickers:
  # Main asset
  primary:
    - QQQ                # Nasdaq-100 ETF (main trading asset)

  # Market context
  indices:
    - SPY                # S&P 500 ETF
    - DIA                # Dow Jones Industrial Average ETF
    - IWM                # Russell 2000 ETF

  # Volatility
  volatility:
    - ^VIX               # CBOE Volatility Index

  # Safe havens / Risk-off assets
  safe_havens:
    - TLT                # 20+ Year Treasury Bond ETF
    - GLD                # Gold ETF
    - SHY                # 1-3 Year Treasury Bond ETF

  # Sector rotation (optional - for additional context)
  sectors:
    - XLK                # Technology Select Sector SPDR
    - XLF                # Financial Select Sector SPDR
    - XLE                # Energy Select Sector SPDR
    - XLV                # Health Care Select Sector SPDR
    - XLY                # Consumer Discretionary SPDR

  # Additional tech-heavy indices for QQQ correlation
  tech:
    - QQQ                # Already in primary, but emphasis on tech
    - SOXX               # Semiconductor ETF
    - IGV                # Software ETF

# Data Fetch Settings
fetch_settings:
  # Default period to fetch when initializing database
  initial_period: "2y"       # 2 years of historical data

  # Period to fetch for incremental updates
  update_period: "5d"        # Last 5 days

  # Data frequency
  frequency: "1d"            # Daily data (1d)
  # For intraday: "1m", "5m", "15m", "30m", "1h"

  # Maximum retries for failed fetches
  max_retries: 3

  # Delay between retries (seconds)
  retry_delay: 5

  # Rate limiting between ticker fetches (seconds)
  rate_limit: 0.5

# FRED API Settings (for economic data)
fred_api:
  # Get free API key from https://fred.stlouisfed.org/docs/api/api_key.html
  api_key: "YOUR_FRED_API_KEY_HERE"  # Replace with your actual API key

  # Economic indicators to track
  series:
    # Federal Funds Rate
    - series_id: "DFF"
      name: "Federal Funds Rate"
      importance: "high"

    # CPI (inflation)
    - series_id: "CPIAUCSL"
      name: "Consumer Price Index"
      importance: "high"

    # Unemployment Rate
    - series_id: "UNRATE"
      name: "Unemployment Rate"
      importance: "high"

    # GDP
    - series_id: "GDP"
      name: "Gross Domestic Product"
      importance: "high"

    # 10-Year Treasury Yield
    - series_id: "DGS10"
      name: "10-Year Treasury Yield"
      importance: "medium"

    # 2-Year Treasury Yield
    - series_id: "DGS2"
      name: "2-Year Treasury Yield"
      importance: "medium"

# Economic Calendar Events
# These are major scheduled events that often cause volatility
economic_events:
  # FOMC meetings (Federal Reserve policy decisions)
  fomc:
    enabled: true
    importance: "high"
    # FOMC typically meets 8 times per year
    # Dates should be updated periodically

  # CPI releases (inflation data)
  cpi:
    enabled: true
    importance: "high"
    # Released monthly, typically mid-month

  # Non-Farm Payrolls (jobs report)
  nfp:
    enabled: true
    importance: "high"
    # Released first Friday of each month

  # GDP releases
  gdp:
    enabled: true
    importance: "high"
    # Released quarterly

  # Earnings seasons
  earnings:
    enabled: true
    importance: "medium"
    # Major tech earnings can significantly impact QQQ

# Yahoo Finance Settings
yahoo_finance:
  # No API key required for basic usage
  # Rate limiting is important to avoid being blocked

  # Request timeout (seconds)
  timeout: 30

  # User agent (some providers check this)
  user_agent: "Mozilla/5.0"

# Database Settings
database:
  # Database file location
  path: "market_regime.db"

  # Backup settings
  backup:
    enabled: true
    frequency: "daily"       # daily, weekly, monthly
    retention_days: 30       # Keep backups for 30 days
    path: "backups/"

# Data Quality Settings
data_quality:
  # Minimum number of data points required for analysis
  min_data_points: 200

  # Maximum allowed gap in data (trading days)
  max_data_gap: 10

  # Maximum percentage of NaN values allowed
  max_nan_percentage: 5

  # Whether to validate data on load
  validate_on_load: true

# Logging
logging:
  level: "INFO"              # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "logs/market_regime.log"
  max_file_size_mb: 10
  backup_count: 5

# Feature Flags
features:
  # Enable economic calendar integration
  enable_economic_calendar: false  # Set to true when FRED API key is configured

  # Enable breadth indicators (requires additional data)
  enable_breadth_indicators: false

  # Enable sector rotation analysis
  enable_sector_rotation: false

  # Enable intraday analysis
  enable_intraday: false

  # Conservative mode (reduce exposure when confidence is low)
  conservative_mode: true
